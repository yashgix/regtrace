[project]
name = "regtrace"
version = "0.1.0"
description = "Trace Federal Register documents tagged to 42 CFR Part 438 against the official point-in-time eCFR"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
# Given by the specification and frozen (restored before every commit), so it is not reformatted here.
extend-exclude = ["tools/fetch_data.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
